[project]
name = "onfloor-telegram-bridge"
version = "0.1.0"
description = "Telegram private-call bridge for OnFloor (py-tgcalls). Owner: Tushar."
requires-python = ">=3.10"
dependencies = [
  "py-tgcalls>=3.0.0",
  "pyrogram>=2.0.106",
  "tgcrypto>=1.2.5",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "scipy>=1.11",
  "websockets>=13",
  "python-dotenv>=1.0",
]
